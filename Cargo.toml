[package]
name = "rvm"
version = "2.6.0"
edition = "2021"
authors = ["RVM Team"]
description = "RVM — Native terminal code editor (Vim + LazyVim UX), written in Rust + Lua"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
syntect = "5.2.0"
clap = { version = "4.5", features = ["derive"] }
unicode-width = "0.2"
dirs = "5.0"
